name: Verify exact fork Android artifact build

on:
  push:
    branches: [codex/probe-android-artifact-41202d5781]

permissions:
  contents: read

env:
  CANDIDATE_SHA: 41202d578128a2117e245e108b940f6a31e9b6e2

jobs:
  version:
    name: Verify the source commit and dry-run version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
      release: ${{ steps.verify.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: verify
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == branch ]]
          [[ "$(git rev-parse HEAD^)" == "$CANDIDATE_SHA" ]]
          [[ "$(git diff --name-only "$CANDIDATE_SHA" HEAD)" == '.github/workflows/probe-release-android.yml' ]]
          printf 'tag=v20.0.0-fork.6\nsha=%s\nrelease=false\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Tested source %s\n' "$CANDIDATE_SHA"

  build-apk:
    name: Android APK (fdroid)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.apk.outputs.sha256 }}
    # Release signing secrets exist only in the `release` environment, which admits fork tags only.
    environment: >-
      ${{ github.event_name == 'push' && github.ref_type == 'tag' &&
          needs.version.outputs.release == 'true' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Version and identity substitution
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: node fork/apply-identity.mjs --tag "$TAG"
      - name: Web build and Capacitor sync
        run: |
          set -euo pipefail
          npm run buildFrontend:prodWeb -- --stats-json
          node fork/release-route.mjs check-web-specs dist/browser dist/browser-stats.json
          # The fork LICENSE ships in the APK as assets/public/LICENSE.
          cp LICENSE dist/browser/LICENSE
          npm run sync:android
      - name: Decode release keystore
        if: github.event_name == 'push' && github.ref_type == 'tag' && needs.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::release keystore secret is empty"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
      - name: Build fdroid debug APK
        if: github.event_name == 'push' && github.ref_type == 'branch' && needs.version.outputs.release == 'false'
        working-directory: android
        run: ./gradlew :app:assembleFdroidDebug
      - name: Build fdroid release APK
        if: github.event_name == 'push' && github.ref_type == 'tag' && needs.version.outputs.release == 'true'
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFdroidRelease
      - name: Remove keystore
        if: always()
        run: rm -f keystore.jks
      - name: Select APK for checks and upload
        id: apk
        env:
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          set -euo pipefail
          case "$RELEASE" in
            true) variant=release ;;
            false) variant=debug ;;
            *) echo "::error::unknown APK build variant"; exit 1 ;;
          esac
          mkdir checked-apk
          find "android/app/build/outputs/apk/fdroid/$variant" -name "*-$variant.apk" -print0 > checked-apk/candidates
          apks=()
          while IFS= read -r -d '' candidate; do
            apks+=("$candidate")
          done < checked-apk/candidates
          rm checked-apk/candidates
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::expected exactly one $variant APK"; exit 1; }
          [ -f "${apks[0]}" ] && [ -s "${apks[0]}" ] && [ ! -L "${apks[0]}" ] \
            || { echo "::error::expected a regular, nonempty $variant APK"; exit 1; }
          apk="checked-apk/app-fdroid-$variant.apk"
          cp "${apks[0]}" "$apk"
          digest="$(sha256sum < "$apk")"
          printf 'CHECKED_APK=%s\n' "$apk" >> "$GITHUB_ENV"
          printf 'sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Check APK manifest and shortcuts
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          apk="$CHECKED_APK"
          echo "apk: $apk"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$aapt2" dump badging "$apk" > badging-full.txt
          head -1 badging-full.txt | tee badging.txt
          code="$(node -e 'import("./fork/apply-identity.mjs").then(m=>console.log(m.versionCode(m.parseTag(process.argv[1]))))' "$TAG")"
          grep -q "package: name='io.github.daniilmann.sptelos'" badging.txt
          grep -q "versionCode='${code}'" badging.txt
          grep -q "versionName='${TAG#v}'" badging.txt
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          grep -q 'android.app.shortcuts' manifest.txt
          # Release builds shorten resource paths (R8), so the file is found through the resource table.
          "$aapt2" dump resources "$apk" > resources.txt
          sfile="$(grep -A1 -E 'resource 0x[0-9a-f]+ xml/shortcuts$' resources.txt | sed -n 's/.*(file) \([^ ]*\) .*/\1/p' | head -1)"
          [ -n "$sfile" ] || { echo "::error::no file for xml/shortcuts in the APK"; exit 1; }
          "$aapt2" dump xmltree --file "$sfile" "$apk" > shortcuts.txt
          grep 'targetPackage' shortcuts.txt
          [ "$(grep -c 'targetPackage.*"io.github.daniilmann.sptelos"' shortcuts.txt)" -eq 3 ]
          if grep 'targetPackage' shortcuts.txt | grep -q '"com.superproductivity.superproductivity"'; then
            echo "::error::an upstream targetPackage is left in shortcuts.xml"; exit 1
          fi
          echo "APK manifest and shortcuts ok"
      - name: LICENSE in the APK
        run: |
          set -euo pipefail
          apk="$CHECKED_APK"
          unzip -p "$apk" assets/public/LICENSE | cmp - LICENSE || { echo "::error::assets/public/LICENSE missing or different"; exit 1; }
          echo "LICENSE ok in the APK"
      - name: APK backup rules exclude all app data
        run: |
          set -euo pipefail
          apk="$CHECKED_APK"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          "$aapt2" dump resources "$apk" > resources.txt
          for name in backup_rules data_extraction_rules; do
            file="$(grep -A1 -E "resource 0x[0-9a-f]+ xml/${name}\$" resources.txt | sed -n 's/.*(file) \([^ ]*\) .*/\1/p' | head -1)"
            [ -n "$file" ] || { echo "::error::no file for xml/${name} in the APK"; exit 1; }
            "$aapt2" dump xmltree --file "$file" "$apk" > "${name}.txt"
          done
          node fork/check-apk-backup.mjs manifest.txt resources.txt backup_rules.txt data_extraction_rules.txt \
            || { grep -E 'BackupContent|dataExtraction' manifest.txt; grep -A1 -E 'xml/(backup_rules|data_extraction_rules)$' resources.txt; head -30 backup_rules.txt; exit 1; }
      - name: Signing certificate
        env:
          # SHA-256 of the release signing certificate. Tag builds must be signed by exactly this certificate.
          RELEASE_CERT_SHA256: 892a3b2ac3ee136ba2650132ddf3bcbcca6a00e2f68d4e3ee4d44006bba25a77
        run: |
          set -euo pipefail
          apk="$CHECKED_APK"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" > certs.txt
          grep -E 'SHA-256|DN' certs.txt
          signers="$(grep -c 'certificate SHA-256 digest' certs.txt)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "$signers" -eq 1 ] || { echo "::error::expected one signer, found $signers"; exit 1; }
            grep -q "certificate SHA-256 digest: ${RELEASE_CERT_SHA256}$" certs.txt \
              || { echo "::error::the APK is not signed by the pinned release certificate"; exit 1; }
            echo "release certificate matches the pinned digest"
          elif grep -q "certificate SHA-256 digest: ${RELEASE_CERT_SHA256}$" certs.txt; then
            echo "::error::a non-tag build is signed by the release certificate"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: ${{ env.CHECKED_APK }}
          if-no-files-found: error
          retention-days: 14
