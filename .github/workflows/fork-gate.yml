# Fork gate and release builds (see FORK.md).
#
# Fast gate: every push and manual run. Builds: fork release tags vM.m.p-fork.N,
# or a manual run with `build: true` and a `tag` value (the tag does not have to exist;
# it only drives the version substitution, and the APK is then debug-signed).
name: fork-gate

on:
  push:
    branches: ['**']
    tags: ['v*-fork.*']
  workflow_dispatch:
    inputs:
      build:
        description: 'Also build DMG and APK'
        type: boolean
        default: false
      tag:
        description: 'Version tag for the build, vM.m.p-fork.N'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: fork-gate-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MAIN_BRANCH: main
  UPSTREAM_URL: https://github.com/super-productivity/super-productivity.git

jobs:
  base:
    name: Pinned upstream base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Base commit is an ancestor of HEAD
        run: |
          set -euo pipefail
          node fork/apply-identity.mjs --check
          commit="$(sed -n 's/^commit=//p' fork/upstream-base)"
          git cat-file -e "${commit}^{commit}"
          git merge-base --is-ancestor "$commit" HEAD
          echo "base $commit is an ancestor of $(git rev-parse HEAD)"
      - name: Did this branch change the pinned base?
        id: changed
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${MAIN_BRANCH}:refs/remotes/origin/${MAIN_BRANCH}"
          B="$(git merge-base "refs/remotes/origin/${MAIN_BRANCH}" HEAD)"
          [ -n "$B" ]
          set +e
          git diff --quiet "$B" HEAD -- fork/upstream-base
          code=$?
          set -e
          case "$code" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git diff exited $code"; exit 1 ;;
          esac
      - name: Verify the pinned tag against upstream
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^tag=//p' fork/upstream-base)"
          commit="$(sed -n 's/^commit=//p' fork/upstream-base)"
          git -c credential.helper= fetch --no-tags "$UPSTREAM_URL" "+refs/tags/${tag}:refs/upstream-check/${tag}"
          actual="$(git rev-parse "refs/upstream-check/${tag}^{commit}")"
          [ "$actual" = "$commit" ] || { echo "::error::upstream ${tag} is ${actual}, file says ${commit}"; exit 1; }
          echo "upstream ${tag} = ${commit}"

  fork-files:
    name: Fork files and Android literals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
      - run: node --test fork/*.test.mjs
      - run: node --test tools/verify-android-shortcuts.test.js tools/verify-android-url-hosts.test.js
      - name: Only fork workflows in .github/workflows
        run: |
          set -euo pipefail
          extra="$(ls .github/workflows | grep -vxF fork-gate.yml || true)"
          [ -z "$extra" ] || { echo "::error::workflows not listed in FORK.md: $extra"; exit 1; }

  lint:
    name: Lint (upstream)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - name: Upstream lint chain (skips tool tests that read removed upstream workflows)
        run: node fork/run-upstream-lint.mjs

  unit:
    name: Unit (upstream, two time zones)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-e2e
      - run: npm run env
      - run: npm run test:electron
      - run: npm run test:ci

  android:
    name: Android (fdroid debug, JVM tests, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Web build and Capacitor sync
        run: |
          set -euo pipefail
          npm run buildFrontend:prodWeb
          npm run sync:android
      - run: node tools/generate-android-crypto-fixtures.mjs
      - name: Is there a lint baseline?
        id: baseline
        run: |
          if [ -f fork/android-lint-baseline.xml ]; then echo "present=true"; else echo "present=false"; fi >> "$GITHUB_OUTPUT"
      - name: fdroid debug build, JVM tests, Android Lint against the baseline
        if: steps.baseline.outputs.present == 'true'
        working-directory: android
        run: ./gradlew --init-script ../fork/android-lint.init.gradle :app:assembleFdroidDebug :app:testFdroidDebugUnitTest :app:lintFdroidDebug
      - name: No baseline yet — create it from this tree
        if: steps.baseline.outputs.present == 'false'
        working-directory: android
        run: ./gradlew --init-script ../fork/android-lint.init.gradle -Dlint.baselines.continue=true :app:lintFdroidDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.baseline.outputs.present == 'false'
        with:
          name: android-lint-baseline
          path: fork/android-lint-baseline.xml
      - name: Baseline created — commit it and rerun
        if: steps.baseline.outputs.present == 'false'
        run: |
          echo "::error::fork/android-lint-baseline.xml was missing; the created file is the android-lint-baseline artifact"
          exit 1
      - name: Executed and skipped JVM tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          t = s = f = e = 0
          for p in glob.glob('android/app/build/test-results/testFdroidDebugUnitTest/*.xml'):
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); s += int(r.get('skipped', 0))
              f += int(r.get('failures', 0)); e += int(r.get('errors', 0))
          print(f'fdroid JVM tests: {t} total, {s} skipped, {f} failed, {e} errors')
          EOF

  gate:
    name: Fast gate
    if: always()
    needs: [base, fork-files, lint, unit, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All fast gate jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  version:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then t="${GITHUB_REF_NAME}"; else t="${INPUT_TAG}"; fi
          [ -n "$t" ] || { echo "::error::no tag for the build"; exit 1; }
          echo "tag=$t" >> "$GITHUB_OUTPUT"

  build-mac:
    name: macOS DMG (ad-hoc)
    needs: version
    # arm64 macOS runners were not acquired (capacity); the universal DMG builds on Intel too.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-electron-build
      - name: Install npm packages
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: npm install "@nx/nx-darwin-$(node -p process.arch)" dmg-license && npm i
      - name: Version substitution
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: node fork/apply-identity.mjs --tag "$TAG"
      - name: Build
        run: |
          set -euo pipefail
          npm run buildFrontend:prod:es6
          npm run electron:build
          npx electron-builder --mac --config fork/electron-builder.fork.yaml --publish never
      - name: Check artifacts
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la .tmp/app-builds
          app="$(find .tmp/app-builds -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "app: $app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          echo "bundle id: $bundle_id; version: $short_version"
          [ "$bundle_id" = io.github.daniilmann.sptelos ]
          [ "$short_version" = "${TAG#v}" ]
          npx --yes @electron/asar extract-file "$app/Contents/Resources/app.asar" package.json
          node -e 'const p=require("./package.json"); console.log("asar name:", p.name, "version:", p.version); if (p.name !== "superProductivityTelos") process.exit(1)'
          codesign -dv --verbose=2 "$app" 2>&1 | tee codesign.txt
          grep -q 'Signature=adhoc' codesign.txt
          ls .tmp/app-builds/*.dmg
          [ -f .tmp/app-builds/superProductivityTelos-arm64.dmg ] || { echo "::error::no arm64 DMG"; exit 1; }
      - name: LICENSE in the app
        run: |
          set -euo pipefail
          find .tmp/app-builds -maxdepth 2 -name '*.app' -type d > apps.txt
          [ -s apps.txt ] || { echo "::error::no .app in the build"; exit 1; }
          while IFS= read -r app; do
            cmp LICENSE "$app/Contents/Resources/LICENSE" || { echo "::error::LICENSE missing or different in $app"; exit 1; }
            echo "LICENSE ok: $app"
          done < apps.txt
      - name: Upstream spec code is not in the build
        run: |
          set -euo pipefail
          grep -rhoE "\bit\('[^']{40,}'" src --include='*.spec.ts' | sed -E "s/^it\('//; s/'$//" | sort -u > spec-titles-all.txt
          head -200 spec-titles-all.txt > spec-titles.txt
          echo "spec titles checked: $(wc -l < spec-titles.txt)"
          [ -s spec-titles.txt ]
          if grep -rFf spec-titles.txt .tmp/angular-dist; then echo "::error::spec titles found in the build"; exit 1; fi
          echo "no spec titles in the build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-dmg
          path: .tmp/app-builds/*.dmg
          retention-days: 14

  build-apk:
    name: Android APK (fdroid)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Release signing secrets exist only in the `release` environment, which admits fork tags only.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Version and identity substitution
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: node fork/apply-identity.mjs --tag "$TAG"
      - name: Web build and Capacitor sync
        run: |
          set -euo pipefail
          npm run buildFrontend:prodWeb
          # The fork LICENSE ships in the APK as assets/public/LICENSE.
          cp LICENSE dist/browser/LICENSE
          npm run sync:android
      - name: Decode release keystore
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::release keystore secret is empty"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
      - name: Build fdroid APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then ./gradlew :app:assembleFdroidRelease; else ./gradlew :app:assembleFdroidDebug; fi
      - name: Remove keystore
        if: always()
        run: rm -f keystore.jks
      - name: Check APK manifest and shortcuts
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/fdroid -name '*.apk' | head -1)"
          echo "apk: $apk"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$aapt2" dump badging "$apk" > badging-full.txt
          head -1 badging-full.txt | tee badging.txt
          code="$(node -e 'import("./fork/apply-identity.mjs").then(m=>console.log(m.versionCode(m.parseTag(process.argv[1]))))' "$TAG")"
          grep -q "package: name='io.github.daniilmann.sptelos'" badging.txt
          grep -q "versionCode='${code}'" badging.txt
          grep -q "versionName='${TAG#v}'" badging.txt
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          grep -q 'android.app.shortcuts' manifest.txt
          "$aapt2" dump xmltree --file res/xml/shortcuts.xml "$apk" > shortcuts.txt
          grep 'targetPackage' shortcuts.txt
          [ "$(grep -c 'targetPackage.*"io.github.daniilmann.sptelos"' shortcuts.txt)" -eq 3 ]
          if grep 'targetPackage' shortcuts.txt | grep -q '"com.superproductivity.superproductivity"'; then
            echo "::error::an upstream targetPackage is left in shortcuts.xml"; exit 1
          fi
          echo "APK manifest and shortcuts ok"
      - name: LICENSE in the APK
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/fdroid -name '*.apk' | head -1)"
          unzip -p "$apk" assets/public/LICENSE | cmp - LICENSE || { echo "::error::assets/public/LICENSE missing or different"; exit 1; }
          echo "LICENSE ok in the APK"
      - name: APK backup rules exclude all app data
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/fdroid -name '*.apk' | head -1)"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          "$aapt2" dump resources "$apk" > resources.txt
          for name in backup_rules data_extraction_rules; do
            file="$(grep -A1 -E "resource 0x[0-9a-f]+ xml/${name}\$" resources.txt | sed -n 's/.*(file) \([^ ]*\) .*/\1/p' | head -1)"
            [ -n "$file" ] || { echo "::error::no file for xml/${name} in the APK"; exit 1; }
            "$aapt2" dump xmltree --file "$file" "$apk" > "${name}.txt"
          done
          node fork/check-apk-backup.mjs manifest.txt resources.txt backup_rules.txt data_extraction_rules.txt \
            || { grep -E 'BackupContent|dataExtraction' manifest.txt; grep -A1 -E 'xml/(backup_rules|data_extraction_rules)$' resources.txt; head -30 backup_rules.txt; exit 1; }
      - name: Signing certificate
        env:
          # SHA-256 of the release signing certificate. Tag builds must be signed by exactly this certificate.
          RELEASE_CERT_SHA256: 892a3b2ac3ee136ba2650132ddf3bcbcca6a00e2f68d4e3ee4d44006bba25a77
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/fdroid -name '*.apk' | head -1)"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" > certs.txt
          grep -E 'SHA-256|DN' certs.txt
          signers="$(grep -c 'certificate SHA-256 digest' certs.txt)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "$signers" -eq 1 ] || { echo "::error::expected one signer, found $signers"; exit 1; }
            grep -q "certificate SHA-256 digest: ${RELEASE_CERT_SHA256}$" certs.txt \
              || { echo "::error::the APK is not signed by the pinned release certificate"; exit 1; }
            echo "release certificate matches the pinned digest"
          elif grep -q "certificate SHA-256 digest: ${RELEASE_CERT_SHA256}$" certs.txt; then
            echo "::error::a non-tag build is signed by the release certificate"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: android/app/build/outputs/apk/fdroid/**/*.apk
          retention-days: 14

  assets:
    name: Plugin API types package and web build
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - name: Version substitution
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: node fork/apply-identity.mjs --tag "$TAG"
      - name: Plugin API types package
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (cd packages/plugin-api && npm pack --pack-destination ../../release-assets)
          tgz="release-assets/super-productivity-plugin-api-${TAG#v}.tgz"
          [ -f "$tgz" ] || { ls release-assets; echo "::error::expected $tgz"; exit 1; }
          tar -tzf "$tgz" | tee pack-list.txt
          grep -qx 'package/dist/index.d.ts' pack-list.txt
          [ "$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')" = "${TAG#v}" ]
      - name: Web build
        run: |
          set -euo pipefail
          npm run buildFrontend:prodWeb
          # productionWeb writes to dist/browser (angular.json).
          dir=dist/browser
          [ -f "$dir/index.html" ] || { echo "::error::no $dir/index.html"; exit 1; }
          cp LICENSE "$dir/LICENSE"
          (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release-assets/superProductivityTelos-web.zip" .)
          ls -la release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          retention-days: 14

  publish:
    name: Publish Release
    if: github.ref_type == 'tag'
    needs: [version, build-mac, build-apk, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          path: downloaded
      - name: Assemble the asset set
        run: |
          set -euo pipefail
          mkdir out
          cp downloaded/mac-dmg/superProductivityTelos-arm64.dmg out/
          apk="$(find downloaded/android-apk -name '*-release.apk' | head -1)"
          [ -n "$apk" ] || { echo "::error::no release APK"; exit 1; }
          cp "$apk" out/superProductivityTelos-fdroid.apk
          cp downloaded/release-assets/* out/
          ls -la out
          [ "$(ls out | wc -l)" -eq 4 ]
      - name: Draft, verify, publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a Release for $TAG already exists; nothing is overwritten (use a new N)"; exit 1
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes "" out/*
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name) \(.size)"' | sort > uploaded.txt
          (cd out && for f in *; do echo "$f $(stat -c %s "$f")"; done) | sort > expected.txt
          diff expected.txt uploaded.txt || { echo "::error::uploaded assets differ from the built set; the draft is left for inspection"; exit 1; }
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
          echo "published $TAG"
